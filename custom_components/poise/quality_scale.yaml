# Home Assistant Integration Quality Scale — self-assessment for Poise.
# https://developers.home-assistant.io/docs/core/integration-quality-scale/
#
# NOTE: Poise is distributed as a HACS *custom* integration, so Home Assistant
# officially classifies it under the "Custom" special tier (the scaled tiers
# Bronze..Platinum apply to core integrations). This file is an honest
# rule-by-rule self-assessment of where the code stands if it were submitted to
# core — and a to-do list for getting there.
#
# Status: done | exempt | todo
rules:
  # ---------------- Bronze ----------------
  config-flow: done
  config-flow-test-coverage: done  # 100% per-file gate in CI (E.12); create/dup-abort/system/reconfigure/options
  test-before-setup: done  # ConfigEntryNotReady when actuator/sensor missing (review A2)
  unique-config-entry: done  # unique_id = actuator; system hub is a singleton
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done  # entry.runtime_data
  entity-event-setup: done  # CoordinatorEntity; coordinator listeners via async_on_unload
  appropriate-polling: done  # 60 s DataUpdateCoordinator tick + event-driven refresh (A6)
  common-modules: done  # coordinator.py; pure core/HA-glue separation (ADR-0005)
  dependency-transparency:
    status: exempt
    # Quoted: the unquoted plain scalar broke on the ": " inside it, which
    # made the whole file unparseable (hassfest only schema-checks
    # quality_scale.yaml for CORE integrations, so CI never noticed).
    comment: "No external Python dependencies (manifest requirements: [])."
  action-setup:
    status: done
    comment: >-
      Both domain services (poise.resume_schedule per ADR-0059 §6 and
      poise.comfort_feedback per ADR-0067 F1) are registered in async_setup;
      all other control uses standard climate/number services.
  docs-actions:
    status: done
    comment: >-
      poise.resume_schedule and poise.comfort_feedback are documented via
      services.yaml (name/description + selectors).
  test-before-configure:
    status: exempt
    comment: >-
      Controls user-selected Home Assistant entities, not an external device or
      service, so there is no connection to test in the flow. Required entities
      are validated at setup via ConfigEntryNotReady (test-before-setup).
  docs-high-level-description: done
  docs-installation-instructions: done
  brands:
    status: todo
    comment: >-
      NOT achievable from this repository — the rule is satisfied by an
      EXTERNAL asset repo, not by anything under custom_components/.
      brand/icon.png + brand/logo.png exist here (both 256x256) and satisfy
      HACS. Outstanding, and only the integration owner (@Ecronika) can do
      it: open a PR against github.com/home-assistant/brands adding
      custom_integrations/poise/ with the icon/logo sizes that repo's README
      mandates (a 512x512 icon@2x is likely needed on top of today's 256px
      assets). Until that PR is merged this entry must stay todo.
  docs-removal-instructions: done  # README "Removing the integration" section

  # ---------------- Silver ----------------
  config-entry-unloading: done  # async_unload_entry + persist/cleanup
  integration-owner: done  # codeowners: ["@Ecronika"]
  entity-unavailable: done  # climate.available + {"available": False} payload
  docs-configuration-parameters: done  # README Configuration table (review E6)
  docs-installation-parameters: done  # README Configuration table covers setup params
  action-exceptions:
    status: exempt
    comment: >-
      poise.resume_schedule takes no free-form input and skips non-applicable
      zones defensively; poise.comfort_feedback validates its single enum
      field via the service schema (vol.In). Neither raises user-facing
      exceptions.
  reauthentication-flow:
    status: exempt
    comment: No authentication; fully local, no credentials.
  parallel-updates: done  # PARALLEL_UPDATES = 0 in every platform module
  log-when-unavailable: done  # room-sensor loss logged once (WARNING) + recovery once (INFO)
  test-coverage: done  # two gated suites: pure core (coverage gate 85) + HA-glue integration (gate 95)

  # ---------------- Gold ----------------
  devices: done  # DeviceInfo per zone + hub; via_device hub<->zone link wired (climate/sensor/switch -> coordinator.via_device_id) (review M9)
  diagnostics: done  # diagnostics/entry.py (redacted)
  reconfiguration-flow: done
  repair-issues: done
  entity-category: done  # diagnostic sensors + config switch
  entity-device-class: done  # temperature/humidity/power device classes
  entity-translations: done  # translation_key + en/de translations
  discovery:
    status: exempt
    comment: Consumes user-selected HA entities; nothing to network-discover.
  discovery-update-info:
    status: exempt
    comment: No network discovery.
  dynamic-devices:
    status: exempt
    comment: One device per config entry; no dynamically appearing sub-devices.
  stale-devices:
    status: exempt
    comment: One device per config entry; removed on unload.
  entity-disabled-by-default:
    status: done
    comment: >-
      19 of the 23 diagnostic sensors (mpc_*, tpi_valve_percent, pi_*,
      ref_offset, beta_s, q_solar, ca_*, t_rm, mrt, tau_hours,
      identification_progress, vent_advice, compressor_guard_blocked,
      tick_duration_ms) ship entity_registry_enabled_default False; only the
      lean user-facing set (operative_temperature, confidence,
      learning_phase, override_expires_at) is enabled — pinned by
      tests/integration/test_entity_defaults.py, together with the
      window-bypass switch and the two feedback buttons.
  exception-translations:
    status: done

  icon-translations:
    status: done

  docs-supported-functions: done  # README capability status + Entities created
  docs-data-update:
    status: done
    comment: >-
      README "How Poise updates its data" — 60 s DataUpdateCoordinator tick,
      the IMMEDIATE vs NEXT_TICK input split (runtime/input_registry.py), the
      unchanged-state/attribute-churn filter, refresh coalescing, the cached
      weather forecast, and the hub's separate 60 s timer with
      update_interval=None.
  docs-supported-devices:
    status: done
    comment: >-
      README "Supported devices" — hard requirements (metric, single target
      temperature, no heat_cool-only, separate room sensor, one zone per
      thermostat), the hvac_modes-based heat/cool capability rule, the table
      of auto-detected optional device features, and an explicit statement
      that only the Sonoff TRVZB has been bench-verified (ADR-0036 addendum);
      everything else is harness/capability-validated. No invented
      "known-good" list.
  docs-known-limitations:
    status: done
    comment: >-
      README "Known limitations" — shadow-only MPC/TPI/PI/calibration, the
      shadow multi-zone allocators, Celsius-only, heat_cool-only rejection,
      the single-writer assumption, one actuator per zone, the adoption
      modality limit, the learning cold start, and the non-goals.
  docs-troubleshooting:
    status: done
    comment: >-
      README "Troubleshooting" — all repair issues taken from the code
      (health_reporter.py, control/pipeline_prepare.py, ha/phase_*.py,
      coordinator.py, hub_coordinator.py, __init__.py, repairs.py), grouped
      by area, each with meaning + action, plus the three fixable suggestion
      flows and a "not a repair issue" section for the common pitfalls
      (clamped override, suppressed device adoption, disabled sensors,
      attributes vs entities, write throttle).
  docs-use-cases:
    status: done
    comment: README "Use cases".
  docs-examples:
    status: done
    comment: >-
      README "Examples" — seven automations plus a card, written against the
      real surface: poise.resume_schedule / poise.comfort_feedback from
      services.yaml, the poise_override_ended and poise_ventilation_advice
      bus events with their actual payload keys, real climate attributes and
      the entity ids pinned by tests/integration/test_entity_defaults.py.

  # ---------------- Platinum ----------------
  strict-typing: done  # mypy --strict over the whole integration (no ignore_errors)
  async-dependency:
    status: exempt
    comment: No external dependency; the integration is fully async.
  inject-websession:
    status: exempt
    comment: No external HTTP client; weather forecasts use HA's own service.
