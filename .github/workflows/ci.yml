name: CI

on:
  push:
  pull_request:
  # E.11b: the harness-freshness guard needs a heartbeat — the LATEST pin can
  # only go stale between commits, so a push-only CI can never notice.
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

jobs:
  validate:
    name: Validate (hassfest + HACS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hassfest (manifest / brands / quality)
        uses: home-assistant/actions/hassfest@master
      - name: HACS (repository structure)
        uses: hacs/action@main
        with:
          category: integration

  quality:
    name: Quality (py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 = declared minimum (pyproject requires-python), 3.13 = HA-min
        # runtime, 3.14 = the runtime CURRENT HA requires (>=3.14.2) — E.11b:
        # testing against current HA is only honest if the pure core, the lint
        # and the type gate also run on the interpreter that HA runs on.
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned tooling
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Type-check (mypy --strict, all modules)
        # E.11b: skipped on 3.14 ON PURPOSE. mypy 1.13.0 ships no cp314 wheel,
        # so pip would compile it from sdist (mypyc) on every run — minutes of
        # CI time for zero extra signal: mypy analyses against
        # `python_version = "3.12"` from pyproject, so the verdict does not
        # depend on the interpreter executing it. Lint and the pure core DO run
        # on 3.14 (ruff is a universal wheel, and the core must actually
        # execute on the interpreter current HA requires).
        if: matrix.python-version != '3.14'
        run: mypy
      - name: Pure-core tests + coverage
        run: pytest --cov=custom_components/poise --cov-fail-under=85

  integration:
    name: Glue integration (HA ${{ matrix.ha-target }}, py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # E.11: two HA targets — MIN is the promised minimum (README badge /
        # hacs.json), LATEST the current stable as API-drift early warning.
        # E.11b: LATEST is HA 2026.8.2 (current stable) via pytest-hacc
        # 0.13.356, which needs Python 3.14.
        # E.13: MIN is HA 2025.10.1, which requires Python >= 3.13.2 — the
        # former 3.12 MIN entry is therefore gone (no HA we support runs on
        # 3.12 any more). The pure core keeps its own 3.12 entry in the
        # quality job: it is HA-free, so the wider floor costs nothing there.
        include:
          - python-version: "3.13"
            ha-target: min
            requirements: requirements-test.txt
          - python-version: "3.14"
            ha-target: latest
            requirements: requirements-test-latest.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install HA test harness (pulls Home Assistant)
        run: pip install -r ${{ matrix.requirements }}
      - name: Guard — integration suite actually collected tests (no silent skip)
        run: |
          # match the real run's options so async tests are actually collected
          N=$(pytest tests/integration -o asyncio_mode=auto --co 2>/dev/null \
                | grep -cE '::' || true)
          echo "integration tests collected: $N"
          if [ "$N" -eq 0 ]; then
            echo "::error::tests/integration collected 0 tests — HA import failed or the dir was skipped. Collection output:"
            pytest tests/integration -o asyncio_mode=auto --co || true
            exit 1
          fi
      - name: Glue integration tests + coverage gate (config flow, setup/unload, live tick)
        run: >-
          pytest tests/integration
          -o asyncio_mode=auto
          -o asyncio_default_fixture_loop_scope=function
          --cov --cov-config=tests/integration/coverage_glue.ini
          --cov-report=term-missing --cov-fail-under=95
      - name: Gate — config_flow.py at 100% (quality scale config-flow-test-coverage)
        # E.12: the quality scale requires FULL coverage for the config flow;
        # the collective 95% gate above cannot see a per-file regression.
        # Reuses the .coverage data the previous step wrote.
        run: coverage report --include='*config_flow.py' --fail-under=100

  min-consistency:
    # E.13: the promised minimum lives in THREE places — hacs.json (what HACS
    # enforces), the README badge (what users read) and requirements-test.txt
    # (what CI actually proves). They drifted apart once already; this gate
    # keeps them in lockstep on every push, not just weekly.
    # GRANULARITY (asked in review): the comparison is major.minor on purpose.
    # The claim is a release SERIES ("2025.10.x and newer"), and the pin tracks
    # the newest patch of that series — patch releases do not move the HA API
    # surface. Demanding an exact match would force the pin onto the .0 build,
    # which drags in a pre-release dependency (see requirements-test.txt).
    name: MIN consistency (hacs.json / README / test-pin series)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: hacs.json, README badge and the MIN pin must agree
        run: |
          python - <<'PY'
          import json, re, sys, urllib.request

          PKG = "pytest-homeassistant-custom-component"
          pin = re.search(
              rf"^{re.escape(PKG)}==(\S+)$", open("requirements-test.txt").read(), re.M
          ).group(1)
          url = f"https://pypi.org/pypi/{PKG}/{pin}/json"
          with urllib.request.urlopen(url) as r:
              info = json.load(r)["info"]
          tested = next(
              req.split("==", 1)[1].split(";")[0].strip()
              for req in info["requires_dist"]
              if req.lower().startswith("homeassistant==")
          )
          hacs = json.load(open("hacs.json"))["homeassistant"]
          badge = re.search(
              r"Home%20Assistant-([0-9.]+)%2B", open("README.md", encoding="utf-8").read()
          ).group(1)

          def minor(v: str) -> tuple[int, int]:
              p = v.split(".")
              return int(p[0]), int(p[1])

          print(
              f"CI tests HA {tested} | hacs.json {hacs} | README badge {badge} "
              "(compared as release series major.minor)"
          )
          bad = []
          if minor(tested) != minor(hacs):
              bad.append(f"hacs.json says {hacs}, CI proves {tested}")
          if minor(tested) != minor(badge):
              bad.append(f"README badge says {badge}, CI proves {tested}")
          if bad:
              print("::error::MIN claim and tested series disagree — " + "; ".join(bad))
              sys.exit(1)
          print("MIN claim and the tested version are the same release series.")
          PY

  harness-freshness:
    # E.11b: "LATEST" must MEAN latest. The pin sat on HA 2026.2.3 while HA
    # had moved to 2026.8 — nothing failed, because a pinned file cannot
    # notice the world moving. This job compares the pin against PyPI and
    # fails loudly when a newer harness (i.e. a newer HA) is available.
    # Deliberately NOT in the `gate` needs list and not run on push/PR: a new
    # upstream release must never turn an unrelated PR red, it must show up as
    # a red scheduled run that says "bump the pin".
    name: Harness freshness (LATEST pin vs. PyPI)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compare requirements-test-latest.txt against the newest release
        run: |
          python - <<'PY'
          import json, re, sys, urllib.request

          PIN_FILE = "requirements-test-latest.txt"
          PKG = "pytest-homeassistant-custom-component"

          pinned = re.search(
              rf"^{re.escape(PKG)}==(\S+)$", open(PIN_FILE).read(), re.M
          ).group(1)
          with urllib.request.urlopen(f"https://pypi.org/pypi/{PKG}/json") as r:
              data = json.load(r)

          def key(v: str) -> tuple[int, ...]:
              m = re.match(r"^(\d+)\.(\d+)\.(\d+)$", v)
              return tuple(int(x) for x in m.groups()) if m else ()

          releases = sorted((v for v in data["releases"] if key(v)), key=key)
          newest = releases[-1]

          def ha_of(version: str) -> str:
              url = f"https://pypi.org/pypi/{PKG}/{version}/json"
              with urllib.request.urlopen(url) as r:
                  info = json.load(r)["info"]
              for req in info.get("requires_dist") or []:
                  if req.lower().startswith("homeassistant=="):
                      return req.split("==", 1)[1].split(";")[0].strip()
              return "unknown"

          print(f"pinned : {pinned} (HA {ha_of(pinned)})")
          print(f"newest : {newest} (HA {ha_of(newest)})")
          if key(pinned) < key(newest):
              print(
                  f"::error::LATEST harness is stale — pinned {pinned} "
                  f"(HA {ha_of(pinned)}), newest {newest} (HA {ha_of(newest)}). "
                  "Bump requirements-test-latest.txt (frontend pin + the "
                  "latest job's python-version too) and re-run the suite."
              )
              sys.exit(1)
          print("LATEST pin is the newest released harness.")
          PY

  card:
    name: Card (build + verify)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: card
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # >=22.6 so `node --test` runs the .ts card tests (type stripping).
          # Node 20 silently discovered/ran ZERO card tests (review F21/F22).
          node-version: "22"
          cache: npm
          cache-dependency-path: card/package-lock.json
      - name: Install (reproducible — lockfile)
        run: npm ci --no-audit --no-fund
      - name: Type-check card (tsc --noEmit)
        run: node node_modules/typescript/bin/tsc --noEmit
      - name: Card unit tests (node --test)
        run: node --test
      - name: Build bundle
        run: node build.mjs
      - name: Assert bundle embeds package version
        run: |
          VER=$(node -p "require('./package.json').version")
          grep -q "poise-card $VER " ../custom_components/poise/frontend/poise-card.js \
            || { echo "::error::built bundle does not embed version $VER"; exit 1; }
      # The four-file comparison (manifest / const / card / pyproject) now lives
      # in tests/test_version_consistency.py, so it also runs locally and in the
      # pure-core job. What stays here is the half that needs the git ref.
      - name: Guard — release tag matches the shipped version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          MANIFEST=$(node -p "require('../custom_components/poise/manifest.json').version")
          if [ "$GITHUB_REF_NAME" != "v$MANIFEST" ]; then
            echo "::error::release tag $GITHUB_REF_NAME does not match the shipped version v$MANIFEST. A tag is what HACS offers users; publishing one that names a different version than manifest/const/card/pyproject ships a lie. Retag - do not edit the files to match the tag."
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches the shipped version."
      - name: Guard — committed bundle matches a fresh build
        run: |
          git diff --exit-code -- ../custom_components/poise/frontend/poise-card.js \
            || { echo "::error::poise-card.js is stale — run 'node build.mjs' in card/ and commit the result"; exit 1; }
      - name: Guard — bundle registers the poise-card element (v0.170.2)
        run: |
          # The whole card is dead without the entry module's
          # customElements.define("poise-card", …) side-effect (HA shows
          # "Custom element doesn't exist: poise-card"). This slipped through once
          # because source AND bundle were consistently missing it, so neither the
          # freshness diff nor tsc/tests (they import pure modules) flagged it.
          # build.mjs asserts the same on every build; this pins it on the committed
          # artifact too — belt and suspenders against a hand-edited/stale bundle.
          BUNDLE=../custom_components/poise/frontend/poise-card.js
          for needle in 'customElements.define("poise-card"' 'customCards'; do
            grep -qF "$needle" "$BUNDLE" \
              || { echo "::error::committed bundle is missing \`$needle\` — the card would not register. Restore the registration block at the end of card/src/poise-card.ts and rebuild."; exit 1; }
          done
      - name: Guard — card options are documented in the card README (ADR-0057)
        run: |
          # doc-drift guard: every user-facing card option must appear in
          # card/README.md, so new layout/display keys can't land only in the ADR.
          missing=""
          for key in density controls history sections chips shadow_pill learning pmv presets; do
            grep -qw "$key" README.md || missing="$missing $key"
          done
          if [ -n "$missing" ]; then
            echo "::error::card options missing from card/README.md:$missing — document them (ADR-0057)."
            exit 1
          fi

  # M7: a single required check that proves validate + quality + integration +
  # card all passed *in the same run* (the per-job gates are no longer decoupled).
  gate:
    name: All gates green
    needs: [validate, quality, integration, min-consistency, card]
    runs-on: ubuntu-latest
    steps:
      - run: echo "validate, quality (pure-core + coverage), integration (glue + coverage) and card all passed"
